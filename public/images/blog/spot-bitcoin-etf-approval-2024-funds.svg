  <text x="430" y="56" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#666666">in the SEC's 10 January 2024 approval order by listing exchange</text>
  <text x="430" y="74" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#666666">NYSE Arca (Grayscale GBTC, Bitwise BITB, Hashdex DEFI), Nasdaq (iShares IBIT, Valkyrie BRRR)</text>
  <text x="430" y="92" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#666666">and Cboe BZX (ARK 21Shares ARKB, Invesco Galaxy BTCO, VanEck HODL, WisdomTree BTCW, Fidelity FBTC, Franklin EZBC)</text>

