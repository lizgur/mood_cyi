<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" role="img" aria-labelledby="cmp-title cmp-desc">
  <title id="cmp-title">Table of the 11 spot bitcoin ETPs in the SEC's 10 January 2024 approval order by listing exchange: NYSE Arca (Grayscale GBTC, Bitwise BITB, Hashdex DEFI), Nasdaq (iShares IBIT, Valkyrie BRRR) and Cboe BZX (ARK 21Shares ARKB, Invesco Galaxy BTCO, VanEck HODL, WisdomTree BTCW, Fidelity FBTC, Franklin EZBC)</title>
  <desc id="cmp-desc">Table of the 11 spot bitcoin ETPs in the SEC's 10 January 2024 approval order by listing exchange: NYSE Arca (Grayscale GBTC, Bitwise BITB, Hashdex DEFI), Nasdaq (iShares IBIT, Valkyrie BRRR) and Cboe BZX (ARK 21Shares ARKB, Invesco Galaxy BTCO, VanEck HODL, WisdomTree BTCW, Fidelity FBTC, Franklin EZBC)</desc>
  <rect width="860" height="640" rx="12" fill="#ffffff" stroke="#eaeaea"/>
