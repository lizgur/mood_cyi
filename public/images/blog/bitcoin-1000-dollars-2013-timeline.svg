<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 560" role="img" aria-labelledby="tl-title tl-desc">
  <title id="tl-title">November 2013 rally on Mt. Gox</title>
  <desc id="tl-desc">Timeline of bitcoin's November 2013 rally on Mt. Gox: $300 on 6 November, $500 on 17 November, the Senate hearing on 18 November, $1,000 on 27 November and a $1,242 high on 29 November.</desc>
  <rect width="860" height="560" rx="12" fill="#ffffff" stroke="#eaeaea"/>
  <text x="430" y="36" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="16" fill="#300B6A">November 2013 rally on Mt. Gox</text>
  <text x="430" y="56" text-anchor="middle" font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#666666">$300 on 6 November to $1,000 on 27 November and a $1,242 high on 29 November</text>

  <line x1="196" y1="88" x2="196" y2="528" stroke="#eaeaea" stroke-width="3"/>

  <circle cx="196" cy="128" r="8" fill="#9658F9"/>
  <text x="24" y="124" font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#300B6A">6 Nov</text>
  <text x="24" y="142" font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#000000">2013</text>
  <text x="220" y="124" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#000000">$300 on Mt. Gox</text>
  <text x="220" y="142" font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#666666">the November rally reaches $300</text>

  <circle cx="196" cy="218" r="8" fill="#5C7515"/>
  <text x="24" y="214" font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#300B6A">17 Nov</text>
  <text x="220" y="206" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#000000">$500 on Mt. Gox</text>
  <text x="220" y="224" font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#666666">the next step in the November run-up</text>

  <circle cx="196" cy="318" r="8" fill="#9658F9"/>
  <text x="24" y="314" font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#300B6A">18 Nov</text>
  <text x="220" y="306" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#000000">US Senate hearing on virtual currencies</text>
  <text x="220" y="324" font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#666666">the Senate's first hearing on bitcoin</text>

  <circle cx="196" cy="418" r="8" fill="#BDFF07" stroke="#5C7515" stroke-width="2"/>
  <text x="24" y="406" font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#300B6A">27 Nov</text>
  <text x="24" y="424" font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#000000">Mt. Gox</text>
  <text x="220" y="406" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#000000">$1,000 on Mt. Gox</text>
  <text x="220" y="424" font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#666666">first US dollar exchange rate to reach $1,000</text>

  <circle cx="196" cy="508" r="8" fill="#9658F9"/>
  <text x="24" y="496" font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#300B6A">29 Nov</text>
  <text x="24" y="514" font-family="Consolas, ui-monospace, monospace" font-size="12" fill="#000000">high</text>
  <text x="220" y="506" font-family="Consolas, ui-monospace, monospace" font-size="13" fill="#000000">$1,242 high on Mt. Gox</text>
</svg>
